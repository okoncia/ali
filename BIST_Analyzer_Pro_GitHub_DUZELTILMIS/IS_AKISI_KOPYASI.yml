name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-13
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Paketleri kur
        run: npm install

      - name: Intel Mac DMG oluştur
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac:x64

      - name: DMG ve ZIP dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: BIST-Analyzer-Pro-macOS-Intel
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
